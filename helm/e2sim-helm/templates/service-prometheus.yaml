apiVersion: v1
kind: Service
metadata:
  name: {{ include "e2sim-helm.fullname" . }}-prometheus
  labels:
    {{- include "e2sim-helm.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: prometheus
      port: {{ .Values.service.portPrometheus }}
      targetPort: prometheus
      protocol: TCP
  selector:
    {{- include "e2sim-helm.selectorLabels" . | nindent 4 }}
