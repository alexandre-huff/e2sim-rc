apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "e2sim-helm.fullname" . }}
  labels:
    {{- include "e2sim-helm.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "e2sim-helm.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "e2sim-helm.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: prometheus
              containerPort: 8080
              protocol: TCP
          command: ["{{ .Values.image.command }}"]
          args: [
            "{{ .Values.image.args.e2term }}",
            "--mcc", "{{ .Values.image.args.mcc }}",
            "--mnc", "{{ .Values.image.args.mnc }}",
            "--nodebid", "{{ .Values.image.args.nodebid }}",
            "-p", "{{ .Values.image.args.port }}",
            "--total-prb-dl", "{{ .Values.image.args.totalPrbDl | default 100 }}",
            "--total-prb-ul", "{{ .Values.image.args.totalPrbUl | default 100 }}",
            "--max-dl-capacity", "{{ printf "%.0f" (float64 (.Values.image.args.maxDlCapacityKbps | default 2500000)) }}",
            "--max-ul-capacity", "{{ printf "%.0f" (float64 (.Values.image.args.maxUlCapacityKbps | default 1000000)) }}",
            "--bandwidth", "{{ .Values.image.args.bandwidthMhz | default 100 }}",
            "--num-prbs", "{{ .Values.image.args.numPrbs | default 273 }}",
            "--scs", "{{ .Values.image.args.subcarrierSpacingKhz | default 30 }}"
          ]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
