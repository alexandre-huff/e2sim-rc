# Test values for e2sim-rc with limited PRB capacity
# Use this to test policy rejection when capacity is exceeded:
#   helm install e2sim-limited ./helm/e2sim-helm -f helm/e2sim-helm/values-limited-capacity.yaml

affinity: {}
fullnameOverride: ''
image:
  args:
    e2term: service-ricplt-e2term-sctp-alpha.ricplt.svc.cluster.local
    mcc: 724
    mnc: 11
    nodebid: 1
    port: 36422
    # Limited PRB capacity for testing policy rejection
    # Any policy requesting more than 50% PRB will be rejected
    totalPrbDl: 50
    totalPrbUl: 50
  command: e2sim-rc
  pullPolicy: Always
  repository: docker.io/zanattabruno/e2sim-rc
  tag: 'orion'
nameOverride: ''
nodeSelector:
podAnnotations: {}
podSecurityContext: {}
replicaCount: 1
resources: {}
service:
  portPrometheus: 8080
  portSimulator: 8090
  tls: []
  type: ClusterIP
tolerations: []
